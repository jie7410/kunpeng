[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/kunpeng-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"

kunpeng-core = { path = "crates/kunpeng-core" }
kunpeng-http = { path = "crates/kunpeng-http" }
kunpeng-provider = { path = "crates/kunpeng-provider" }
kunpeng-adapter-openai = { path = "crates/kunpeng-adapter-openai" }
kunpeng-adapter-anthropic = { path = "crates/kunpeng-adapter-anthropic" }
kunpeng-runtime = { path = "crates/kunpeng-runtime" }
kunpeng-agents = { path = "crates/kunpeng-agents" }
kunpeng-tools = { path = "crates/kunpeng-tools" }
kunpeng-context = { path = "crates/kunpeng-context" }
kunpeng-memory = { path = "crates/kunpeng-memory" }
kunpeng-multi = { path = "crates/kunpeng-multi" }
kunpeng-rag = { path = "crates/kunpeng-rag" }
kunpeng-mcp = { path = "crates/kunpeng-mcp" }
kunpeng-a2a = { path = "crates/kunpeng-a2a" }
kunpeng-anp = { path = "crates/kunpeng-anp" }
kunpeng-android = { path = "crates/kunpeng-android" }

[workspace.lints.rust]
# 全库不使用 unsafe；新增 crate 自动继承，无需逐文件声明。
unsafe_code = "deny"

[profile.release]
lto = true
strip = true
