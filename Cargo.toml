[package]
name = "kunpeng"
version = "0.1.0"
edition = "2021"

[dependencies]
# sync → 事件/取消；time → 工具超时/重试退避；io-std → CLI 异步读取 stdin。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }

# 纯 rustls，避免依赖系统 OpenSSL，便于跨平台分发。
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 原生 async fn trait 还不能用于 dyn Protocol，用宏脱糖为 BoxFuture。
async-trait = "0.1"

[profile.release]
lto = true
strip = true
